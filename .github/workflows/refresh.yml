name: refresh card

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose - Actions queues are congested at :00
    # and scheduled jobs get delayed there.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# A scheduled run and a push run must never race each other to the same commit.
concurrency:
  group: refresh-card
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately no GITHUB_TOKEN fallback. That token authenticates as the
      # Actions bot and sees only public repos, so falling back would quietly
      # publish a card that misrepresents the work. Better to stop.
      - name: Require STATS_TOKEN
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::STATS_TOKEN is not set. Add a classic PAT with 'repo'"
            echo "::error::scope so private repositories are counted."
            exit 1
          fi

      # No third-party packages: the renderer is stdlib only. Pillow is needed
      # for the dither tiles, but those are committed and never rebuilt here.
      - name: Render the card
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/languages.py

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg assets/languages-v1.svg
          git diff --quiet --cached && echo "no change" && exit 0
          git commit -m "chore: refresh language card"
          git push
